<div class="login-page">
  <div class="login-box">

    <!-- Logo -->
    <div class="logo-wrapper">
      <img src="/ascent-logo.png" alt="School Logo" class="school-logo" />
    </div>

    <!-- Form -->
    <form [formGroup]="userForm" class="form-content">
      
      <!-- Username -->
      <div class="form-group">
        <input 
          type="email" 
          id="username"
          formControlName="username" 
          placeholder="Enter your username"
          class="form-input"
        />
        <!-- Username Icon -->
        <span class="input-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 
                     1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 
                     1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </span>
        <div class="text-danger">
          @if (userForm.controls['username'].touched && userForm.controls['username'].errors?.['required']) {
            <span>This is required</span>
          }
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <input 
          type="password" 
          id="password"
          formControlName="password" 
          placeholder="Enter your password"
          class="form-input"
        />
        <!-- Password Eye Toggle -->
        <button type="button" class="password-toggle" (click)="togglePassword()">
          <svg viewBox="0 0 24 24" id="eyeIcon">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 
                     12c1.73 4.39 6 7.5 11 
                     7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 
                     17c-2.76 0-5-2.24-5-5s2.24-5 
                     5-5 5 2.24 5 5-2.24 5-5 
                     5zm0-8c-1.66 0-3 1.34-3 
                     3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </button>
        <div class="text-danger">
          @if (userForm.controls['password'].touched && userForm.controls['password'].errors?.['minlength']) {
            <span>This is required</span>
          }
        </div>
      </div>

      <!-- Button -->
      <button class="btn-login" (click)="login()">Login</button>

      <!-- Register -->
      <div class="register" [hidden]="true">
        <p>Don’t have an account? <a routerLink="/register">Register</a></p>
      </div>

      <div class="secure-text">
        🔒 Secure Login Portal
      </div>

    </form>
  </div>
</div>
